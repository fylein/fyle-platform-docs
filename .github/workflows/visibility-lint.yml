name: OpenAPI visibility lint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.yaml'
      - 'plugins/visibility-rules.mjs'
      - 'redocly.visibility.yaml'
      - 'tests/visibility-rules.test.mjs'
      - '.github/workflows/visibility-lint.yml'

permissions:
  contents: read

jobs:
  visibility-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@2.19.0

      - name: Test visibility rule
        run: node --test tests/visibility-rules.test.mjs

      - name: Find changed OpenAPI source files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'src/**/*.yaml')"
          {
            echo 'files<<EOF'
            echo "$changed_files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Lint changed operations
        if: steps.changed-files.outputs.files != ''
        env:
          X_INTERNAL_CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          redocly lint \
            src/authorization/openapi.yaml \
            src/admin/openapi.yaml \
            src/spender/openapi.yaml \
            src/approver/openapi.yaml \
            src/hod/openapi.yaml \
            src/hop/openapi.yaml \
            src/common/openapi.yaml \
            src/accountant/openapi.yaml \
            src/super_admin/openapi.yaml \
            src/owner/openapi.yaml \
            src/manager/openapi.yaml \
            --config redocly.visibility.yaml
