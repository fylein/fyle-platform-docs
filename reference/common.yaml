components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.fylehq.com/app/developers/oauth/authorize
          tokenUrl: https://accounts.fylehq.com/oauth/token
          scopes:
            '*': Grant all actions
  schemas:
    '400':
      type: object
      properties:
        message:
          type: string
          nullable: true
          description: |
            Message describing why the request is invalid
    '401':
      type: object
      properties:
        message:
          enum:
            - invalid token
          type: string
          description: |
            This error means that the input access token is either not issued by Sage Exp Mgmt or has expired.
            You need to generate a new access token.
    '404':
      type: object
      properties:
        message:
          enum:
            - Resource not found
          type: string
          description: |
            This error means the requested resource was not found or the requester doesn't have sufficient access.
    common_employee_approver_allowed_out:
      type: object
      additionalProperties: false
      required:
        - is_approver_allowed
      properties:
        is_approver_allowed:
          type: boolean
          description: Whether the user can be selected as an approver.
          example: true
    common_invalid_usage_error_out:
      type: object
      additionalProperties: false
      required:
        - data
        - error
        - message
      properties:
        data:
          type: object
          nullable: true
          description: Additional error data. These operations return null.
          example: null
        error:
          type: string
          enum:
            - InvalidUsage
        message:
          type: string
          description: Reason the operation could not be completed.
    common_employee_mobile_verification_in:
      type: object
      additionalProperties: false
      required:
        - mobile_number
      properties:
        mobile_number:
          type: string
          description: Mobile number to check.
          example: '+1234567890'
    common_employee_mobile_verification_out:
      type: object
      additionalProperties: false
      required:
        - is_mobile_number_verified
      properties:
        is_mobile_number_verified:
          type: boolean
          description: Whether the mobile number is verified for an employee.
          example: true
    common_request_error_out:
      type: object
      additionalProperties: false
      required:
        - data
        - error
        - message
      properties:
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Validation messages keyed by request field, or null for usage errors.
        error:
          type: string
          enum:
            - InvalidUsage
            - ValidationError
        message:
          type: string
          nullable: true
          description: Usage-error details, or null for request validation errors.
    currency:
      type: string
      description: |
        The three-letter currency code following ISO standard <a href='https://www.iso.org/iso-4217-currency-codes.html'>ISO 4217</a>.
      example: USD
      pattern: ([A-Z]{3})
    org_signup_params_in:
      type: object
      additionalProperties: false
      required:
        - org_currency
        - org_name
      properties:
        auth:
          type: string
          nullable: true
        asset:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        employee_type:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        employee_count:
          type: string
          nullable: true
        org_name:
          type: string
          example: Cresco
        org_currency:
          $ref: '#/components/schemas/currency'
    org_signup_in:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - full_name
        - signup_params
        - title
        - internal_signup_token
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 32
          description: |
            Password containing at least one uppercase letter, lowercase letter, digit, and symbol.
        full_name:
          type: string
          example: Test User
        mobile:
          anyOf:
            - type: string
            - type: number
          description: Mobile numbers supplied as JSON numbers are converted to strings.
          example: '+1234567890'
        signup_params:
          $ref: '#/components/schemas/org_signup_params_in'
        title:
          type: string
          example: Admin
        internal_signup_token:
          type: string
          writeOnly: true
          description: Internal token authorizing organization creation.
    org_signup_validate_in:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
    id_string:
      type: string
      maxLength: 15
      description: |
        This id is provided by Sage Exp Mgmt to identify an object.
      example: sdfd2391
    secondary_email_verify_in:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/id_string'
          description: Identifier of the secondary email to verify.
          example: seu2gy8ulk32
    count:
      type: integer
      description: |
        The total number of objects that can be requested.
      example: 10000
    offset:
      description: |
        offset is used to skip that many number of objects before counting. <br>
        For example, if there are 2000 objects, <br>
        The first request will have offset as 0 and limit as 200 to return first 200 objects. <br>
        The second request will have offset as 200 and limit as 200 to return next 200 objects. <br>
      type: integer
      example: 10
    place_out_minimal:
      type: object
      required:
        - id
        - formatted_address
      properties:
        id:
          type: string
          maxLength: 255
          description: It containes a textual identifier that uniquely identifies a place.
          example: ChIJify3BTzI5zsR2q86fwXrh74
        formatted_address:
          type: string
          example: 221 Baker St, Marylebone, London, United Kingdom
    place_out:
      type: object
      additionalProperties: false
      required:
        - id
        - city
        - state
        - country
        - formatted_address
        - latitude
        - longitude
      properties:
        id:
          type: string
          maxLength: 255
          description: It containes a textual identifier that uniquely identifies a place.
          example: ChIJify3BTzI5zsR2q86fwXrh74
        city:
          type: string
          example: London
        state:
          type: string
          example: London
        country:
          type: string
          example: United Kingdom
        formatted_address:
          type: string
          example: 221 Baker St, Marylebone, London, United Kingdom
        latitude:
          type: number
          example: 12.971599
        longitude:
          type: number
          example: 77.594566
    exchange_rate_out:
      type: object
      required:
        - exchange_rate
      additionalProperties: false
      properties:
        exchange_rate:
          type: number
          example: 12.123456
    logo_file_generate_download_url_action_out:
      type: object
      required:
        - id
        - name
        - content_type
        - download_url
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/id_string'
        name:
          type: string
          description: |
            Name of the uploaded file.
          example: uber_expenses_vmrpw.pdf
        content_type:
          type: string
          example: image/png
        download_url:
          type: string
          description: |
            Link to download this file
