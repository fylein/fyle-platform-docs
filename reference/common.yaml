openapi: 3.0.3
info:
  version: '3.0'
  title: Common APIs
  description: |
    These APIs are common and used by every role.
  contact:
    name: Platform Beta
    email: support@fylehq.com
servers:
  - url: https://us1.fylehq.com/platform/v1
    description: US Region Server
  - url: https://in1.fylehq.com/platform/v1
    description: India Region Server
tags:
  - name: Currencies
    description: |
      These APIs gives you list of currencies supported by Sage Exp Mgmt and their exchange rates.
  - name: Employees
    description: |
      These APIs give you access to employee-related operations.
  - name: Organizations
    description: |
      These APIs give you access to organization signup operations.
  - name: Places
    description: |
      These APIs gives the places suggestions and geographic data of a place.
  - name: Secondary Emails
    description: |
      These APIs give you access to secondary-email operations.
paths:
  /common/employees/approver_allowed:
    get:
      tags:
        - Employees
      security:
        - oauth2:
            - '*'
      summary: Check whether an approver is allowed
      description: Checks whether the user with the supplied email can be selected as an approver.
      operationId: common_employees_approver_allowed_get
      parameters:
        - in: query
          name: email
          required: true
          description: Email address of the user to check.
          schema:
            type: string
            example: user@example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/common_employee_approver_allowed_out'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
  /common/employees/is_mobile_verified:
    post:
      tags:
        - Employees
      security:
        - oauth2:
            - '*'
      summary: Check whether a mobile number is verified
      description: Checks whether the supplied mobile number is verified for an employee.
      operationId: common_employees_is_mobile_verified_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/common_employee_mobile_verification_in'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/common_employee_mobile_verification_out'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_request_error_out'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
  /common/orgs/signup:
    post:
      tags:
        - Organizations
      security: []
      summary: Create an organization account
      description: Creates a new organization and its owner account using an internal signup token.
      operationId: common_orgs_signup_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/org_signup_in'
      responses:
        '200':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_request_error_out'
        '403':
          description: Invalid or missing internal signup token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
  /common/orgs/signup/validate:
    post:
      tags:
        - Organizations
      security: []
      summary: Validate an organization signup
      description: Checks whether the supplied email can be used to create an organization account.
      operationId: common_orgs_signup_validate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/org_signup_validate_in'
      responses:
        '200':
          description: Signup is allowed
        '400':
          description: Bad request or verified organization domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_request_error_out'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
  /common/secondary_emails/verify:
    post:
      tags:
        - Secondary Emails
      security: []
      summary: Verify a secondary email
      description: Marks the secondary email identified by the supplied ID as verified.
      operationId: common_secondary_emails_verify_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/secondary_email_verify_in'
      responses:
        '200':
          description: Secondary email verified
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_request_error_out'
        '404':
          description: Secondary email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
        '409':
          description: Email is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_invalid_usage_error_out'
  /common/places/autocomplete:
    get:
      tags:
        - Places
      summary: Suggest places
      description: |
        Lists all the place suggestions based on given query.
      operationId: places_autocomplete
      parameters:
        - in: query
          name: q
          required: true
          description: |
            The query string on which to search. The service will return candidate matches
            based on this string and order results based on their perceived relevance.<br>

            q=bangalore
          schema:
            type: string
            example: bangalore
        - in: query
          name: types
          required: true
          description: |
            The types of place results to return.<br>

            Note the `()` which represents the collection of multiple types.<br>

            For more information click <a
            href='https://developers.google.com/places/web-service/supported_types#table3'>here</a>.<br>

            types=(cities)
          schema:
            type: string
            example: (cities)
            enum:
              - (cities)
              - (regions)
              - geocode
              - address
              - establishment
        - in: query
          name: current_location
          description: |
            This param specifies the point around which you wish to retrieve place
            information.<br>

            location=latitude,longitude
          schema:
            type: string
            example: 26.595889,85.4891037
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - count
                  - offset
                properties:
                  count:
                    $ref: '#/components/schemas/count'
                  offset:
                    $ref: '#/components/schemas/offset'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/place_out_minimal'
        '400':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
  /common/places:
    get:
      tags:
        - Places
      summary: List places
      description: |
        Lists all the place suggestions based on given query.
      operationId: places_list
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
            example: ChIJify3BTzI5zsR2q86fwXrh74
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - count
                  - offset
                properties:
                  count:
                    $ref: '#/components/schemas/count'
                  offset:
                    $ref: '#/components/schemas/offset'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/place_out'
        '400':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
  /common/currency/list:
