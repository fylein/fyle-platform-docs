spender_onboarding_out:
  type: object
  additionalProperties: False
  required:
    - user_id
    - org_id
    - state
    - step_connect_cards_is_configured
    - step_connect_cards_is_skipped
    - step_sms_opt_in_is_configured
    - step_sms_opt_in_is_skipped
    - step_show_welcome_modal_is_complete
  properties:
    user_id:
      $ref: '../../components/schemas/fields.yaml#/user_id'
    org_id:
      $ref: '../../components/schemas/fields.yaml#/org_id'
    state:
      type: string
      enum:
        - YET_TO_START
        - IN_PROGRESS
        - COMPLETED
      description: |
        Overall state of the authenticated spender's onboarding.
      example: IN_PROGRESS
    step_connect_cards_is_configured:
      type: boolean
      description: |
        Indicates whether the connect cards onboarding step has been configured.
      example: true
    step_connect_cards_is_skipped:
      type: boolean
      description: |
        Indicates whether the connect cards onboarding step has been skipped.
      example: false
    step_sms_opt_in_is_configured:
      type: boolean
      description: |
        Indicates whether the SMS opt-in onboarding step has been configured.
      example: true
    step_sms_opt_in_is_skipped:
      type: boolean
      description: |
        Indicates whether the SMS opt-in onboarding step has been skipped.
      example: false
    step_show_welcome_modal_is_complete:
      type: boolean
      description: |
        Indicates whether the welcome modal onboarding step has been completed.
      example: true

spender_onboarding_step_sms_opt_in_in:
  type: object
  additionalProperties: False
  properties:
    is_configured:
      type: boolean
      description: |
        Set to `true` to mark the SMS opt-in step as configured. Exactly one of
        `is_configured` or `is_skipped` must be provided.
      example: true
    is_skipped:
      type: boolean
      description: |
        Set to `true` to mark the SMS opt-in step as skipped. Exactly one of
        `is_configured` or `is_skipped` must be provided.
      example: false

spender_onboarding_step_sms_opt_in_out:
  type: object
  additionalProperties: False
  required:
    - is_configured
    - is_skipped
  properties:
    is_configured:
      type: boolean
      description: |
        Indicates whether the SMS opt-in onboarding step has been configured.
      example: true
    is_skipped:
      type: boolean
      description: |
        Indicates whether the SMS opt-in onboarding step has been skipped.
      example: false

spender_onboarding_step_show_welcome_modal_in:
  type: object
  additionalProperties: False
  required:
    - is_complete
  properties:
    is_complete:
      type: boolean
      description: |
        Set to `true` to mark the welcome modal onboarding step as complete.
      example: true

spender_onboarding_step_show_welcome_modal_out:
  type: object
  additionalProperties: False
  required:
    - is_complete
  properties:
    is_complete:
      type: boolean
      description: |
        Indicates whether the welcome modal onboarding step has been completed.
      example: true

spender_onboarding_step_connect_cards_in:
  type: object
  additionalProperties: False
  properties:
    is_configured:
      type: boolean
      description: |
        Set to `true` to mark the connect cards step as configured. Exactly one of
        `is_configured` or `is_skipped` must be provided.
      example: true
    is_skipped:
      type: boolean
      description: |
        Set to `true` to mark the connect cards step as skipped. Exactly one of
        `is_configured` or `is_skipped` must be provided.
      example: false

spender_onboarding_step_connect_cards_out:
  type: object
  additionalProperties: False
  required:
    - is_configured
    - is_skipped
  properties:
    is_configured:
      type: boolean
      description: |
        Indicates whether the connect cards onboarding step has been configured.
      example: true
    is_skipped:
      type: boolean
      description: |
        Indicates whether the connect cards onboarding step has been skipped.
      example: false
