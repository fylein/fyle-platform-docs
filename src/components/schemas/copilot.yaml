copilot_chat_out:
  type: object
  additionalProperties: False
  required:
    - id
    - org_id
    - user_id
    - title
    - created_at
    - updated_at
  properties:
    id:
      allOf:
        - $ref: './fields.yaml#/id_string'
      description: |
        Unique identifier of the Copilot chat.
      example: chAsf91e4r
    org_id:
      $ref: './fields.yaml#/org_id'
    user_id:
      $ref: './fields.yaml#/user_id'
    title:
      type: string
      description: |
        Title of the Copilot chat.
      example: Sprint Planning
    created_at:
      $ref: './fields.yaml#/created_at'
    updated_at:
      $ref: './fields.yaml#/updated_at'

copilot_chat_in:
  type: object
  additionalProperties: False
  required:
    - title
  properties:
    id:
      type: string
      nullable: true
      maxLength: 15
      description: |
        Unique identifier of an existing Copilot chat to update its title. Omit to create a new chat.
      example: chAsf91e4r
    title:
      type: string
      description: |
        Title of the Copilot chat.
      example: Sprint Planning

copilot_chat_delete_in:
  type: object
  additionalProperties: False
  required:
    - id
  properties:
    id:
      type: string
      maxLength: 15
      description: |
        Unique identifier of the Copilot chat to delete.
      example: chAsf91e4r

copilot_chat_message_out:
  type: object
  additionalProperties: False
  required:
    - id
    - chat_id
    - org_id
    - user_id
    - author
    - message
    - metadata
    - feedback
    - created_at
    - updated_at
  properties:
    id:
      allOf:
        - $ref: './fields.yaml#/id_string'
      description: |
        Unique identifier of the Copilot chat message.
      example: msg6O3VP8XIFa
    chat_id:
      type: string
      maxLength: 15
      description: |
        Unique identifier of the Copilot chat this message belongs to.
      example: chAsf91e4r
    org_id:
      $ref: './fields.yaml#/org_id'
    user_id:
      $ref: './fields.yaml#/user_id'
    author:
      type: string
      enum:
        - USER
        - SYSTEM
      description: |
        Indicates whether the message was sent by the user or generated by Copilot.
      example: SYSTEM
    message:
      type: string
      nullable: true
      description: |
        Text content of the message.
      example: Top 3 spenders
    metadata:
      type: object
      additionalProperties: true
      description: |
        Free-form metadata generated by Copilot for this message, such as graph data points.
        Structure varies by query type.
      example: {}
    feedback:
      type: object
      additionalProperties: true
      description: |
        Feedback recorded for this message, if any.
      example: {}
    created_at:
      $ref: './fields.yaml#/created_at'
    updated_at:
      $ref: './fields.yaml#/updated_at'

copilot_chat_message_create_in:
  type: object
  additionalProperties: False
  required:
    - message
  properties:
    chat_id:
      type: string
      maxLength: 15
      description: |
        Unique identifier of an existing Copilot chat to post the message to. When omitted, a new
        chat is created using `title`, and `title` becomes required.
      example: chAsf91e4r
    title:
      type: string
      description: |
        Title for a new Copilot chat. Required when `chat_id` is not provided.
      example: Show spend since
    message:
      type: string
      minLength: 1
      description: |
        The user's message to Copilot.
      example: Show spend since 2023-04-01

copilot_chat_message_feedback_in:
  type: object
  additionalProperties: False
  required:
    - id
    - sentiment
  properties:
    id:
      type: string
      maxLength: 15
      description: |
        Unique identifier of the Copilot chat message to record feedback for.
      example: msg6O3VP8XIFa
    sentiment:
      type: string
      enum:
        - positive
        - negative
      description: |
        Feedback sentiment for the message.
      example: positive
    comment:
      type: string
      minLength: 1
      description: |
        Optional comment accompanying the feedback.
      example: This was very helpful
