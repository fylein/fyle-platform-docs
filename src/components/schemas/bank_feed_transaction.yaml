bank_feed_transaction_payload_in:
  type: object
  additionalProperties: False
  required:
    - org_id
    - amount
    - currency
    - spent_at
    - corporate_card_id
  properties:
    org_id:
      $ref: './fields.yaml#/org_id'
    amount:
      type: number
      format: double
      description: |
        Amount of the transaction.
      example: 99.5
    currency:
      type: string
      description: |
        Currency of the transaction.
      example: USD
    spent_at:
      $ref: './fields.yaml#/timestamptz_utc'
    corporate_card_id:
      type: string
      description: |
        Unique identifier of the corporate card the transaction belongs to.
      example: baccAy1ZFvgqwm
    post_date:
      allOf:
        - $ref: './fields.yaml#/timestamptz_utc'
      nullable: true
      description: |
        Date the transaction was posted, if different from `spent_at`.
    description:
      type: string
      nullable: true
      description: |
        Description of the transaction, as provided by the bank feed.
      example: AMAZON.COM
    foreign_currency:
      type: string
      nullable: true
      description: |
        Foreign currency of the transaction, if applicable.
      example: EUR
    foreign_amount:
      type: number
      format: double
      nullable: true
      description: |
        Amount of the transaction in its foreign currency, if applicable.
      example: 85.2
    code:
      type: string
      description: |
        Unique code identifying this transaction on the bank feed, used for deduplication.
      example: bc487211a32542148225c6873f4bb1fa
    merchant:
      type: string
      nullable: true
      description: |
        Merchant name of the transaction.
      example: Amazon
    category:
      type: string
      nullable: true
      description: |
        Category of the transaction, as provided by the bank feed.
      example: Shopping
    mcc:
      type: string
      nullable: true
      description: |
        Merchant category code of the transaction.
      example: '5666'
    user_id:
      type: string
      nullable: true
      description: |
        Unique identifier of the user the transaction belongs to, if known.
      example: uswjwgnwwgo
    assignor_user_id:
      type: string
      nullable: true
      description: |
        Unique identifier of the user who assigned this card, if applicable.
      example: uswjwgnwwgo
    metadata:
      type: object
      nullable: true
      additionalProperties: true
      description: |
        Free-form additional metadata for the transaction, as provided by the bank feed.
      example:
        merchant_category_code: 5666

bank_feed_transaction_bulk_create_in:
  type: object
  additionalProperties: False
  required:
    - payload
  properties:
    payload:
      $ref: '#/bank_feed_transaction_payload_in'
