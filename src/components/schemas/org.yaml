    - name
    - domain
    - currency
  properties:
    id:
      $ref: './fields.yaml#/org_id'
    name:
      type: string
      maxLength: 255
      description: Represents the name of the org.
      example: Demo Account
    domain:
      type: string
      maxLength: 255
