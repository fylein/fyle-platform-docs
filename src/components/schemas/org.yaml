org_weekly_invitation_usage_out:
  type: object
  additionalProperties: false
  required:
    - id
    - invitation_sent
    - is_limit_reached
    - weekly_limit
  properties:
    id:
      $ref: './fields.yaml#/org_id'
    weekly_limit:
      type: integer
      nullable: true
      description: |
        The maximum number of employee invitations allowed per week.
        This is `null` when the organisation is within its onboarding period and no limit applies.
      example: 50
    invitation_sent:
      type: integer
      description: |
        The number of successful employee invitations sent during the current calendar week.
      example: 12
    is_limit_reached:
      type: boolean
      description: |
        Indicates whether the weekly invitation limit has been reached.
        Always `false` when `weekly_limit` is `null`.
      example: false

org_out_embed:
