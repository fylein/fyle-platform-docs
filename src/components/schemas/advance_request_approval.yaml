advance_request_approval_out_embed:
  type: object
  additionalProperties: False
  required:
    - approver_user_id
    - approver_user
    - state
  properties:
    approver_user_id:
      allOf:
        - $ref: ./fields.yaml#/id_string
      example: usge49ielgel
    approver_user:
      $ref: ./user.yaml#/user_out_embed
    state:
      type: string
      enum:
        - APPROVAL_PENDING
        - APPROVAL_DISABLED
        - APPROVAL_DONE
        - APPROVAL_REJECTED
      description: |
        State of this advance request approval
