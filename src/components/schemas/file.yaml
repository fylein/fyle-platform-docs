file_out:
  type: object
  additionalProperties: false
  required:
    - id
    - org_id
    - user_id
    - created_at
    - updated_at
    - name
    - type
    - content_type
    - download_url
    - upload_url
  properties:
    id:
      $ref: './fields.yaml#/id_string'
    org_id:
      $ref: './fields.yaml#/org_id'
    user_id:
      $ref: './fields.yaml#/fk_string'
    created_at:
      $ref: './fields.yaml#/created_at'
    updated_at:
      $ref: './fields.yaml#/updated_at'
    name:
      type: string
      description: |
        Name of the uploaded file.
      example: uber_expenses_vmrpw.pdf
    type:
      type: string
      enum:
        - INTEGRATION
        - RECEIPT
        - XLSX
        - CSV
        - PDF
      description: >
        Indicates whether this file original size or encrypted or its thumbnail
        image.
      example: RECEIPT
    content_type:
      type: string
      example: 'text/csv'
    download_url:
      type: string
      description: |
        Opaque URL used to download this file. This is a platform-api URL when
        file streaming is requested and an S3 presigned URL in compatibility mode.
    upload_url:
      nullable: true
      type: string
      description: |
        Opaque URL used to upload the contents of this file. This is a
        platform-api URL when file streaming is requested and an S3 presigned
        URL in compatibility mode.
        Returns null if linked to an expense or advance request in approved or higher state.


file_generate_urls_action_in:
  type: object
  required:
    - id
  properties:
    id:
      $ref: './fields.yaml#/id_string'
    requires_signed_url:
      type: boolean
      nullable: false
      default: false
      description: |
        Whether `download_url` should be signed by the Fyle auth service.
        This applies only when `X-Fyle-File-Streaming-Supported` is `true`.
        If `true`, each request returns a newly generated signed Fyle download
        URL with a five-minute validity. If `false` or omitted, the response
        contains the direct platform-api download URL. This option does not
        change `upload_url`.
  example:
    id: fiH717IpzaTG
    requires_signed_url: false


file_generate_urls_action_out:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - content_type
    - download_url
    - upload_url
  properties:
    id:
      $ref: './fields.yaml#/id_string'
    name:
      type: string
      description: |
        Name of the uploaded file.
      example: uber_expenses_vmrpw.pdf
    content_type:
      type: string
      example: 'text/csv'
    download_url:
      type: string
      description: |
        Opaque URL used to download this file. Depending on the request, this
        can be a direct platform-api URL, a signed Fyle URL, or an S3 presigned URL.
    upload_url:
      nullable: true
      type: string
      description: |
        Opaque URL used to upload the contents of this file. Requesting a signed
        download URL does not change this value. Returns null for manager
        responses or if the file is linked to an expense or advance request in
        approved or higher state.


file_out_embed:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - type
    - content_type
  properties:
    id:
      allOf:
        - $ref: './fields.yaml#/id_string'
      example: figwiwpjww
    name:
      type: string
      description: |
        Name of the uploaded file.
      example: uber_expenses_vmrpw.pdf
    type:
      type: string
      enum:
        - INTEGRATION
        - RECEIPT
      description: >
        Indicates whether this file original size or encrypted or its thumbnail
        image.
      example: RECEIPT
    content_type:
      type: string
      example: 'application/pdf'

file_in:
  type: object
  required: [ name, type ]
  properties:
    id:
        $ref: './fields.yaml#/id_string'
    name:
      type: string
      description: |
        Name of the uploaded file.
      example: uber_expenses_vmrpw.pdf
    type:
      type: string
      enum:
        - INTEGRATION
        - RECEIPT
        - XLSX
        - CSV
        - PDF
      description: >
        Indicates whether this file original size or encrypted or its thumbnail
        image.
      example: RECEIPT
    password:
      type: string
      description: |
        Password which required to unlock the file.
      example: SuperSecretPassword

admin_file_in:
  allOf:
    - $ref: '#/file_in'
    - type: object
      required: [ user_id ]
      properties:
        user_id:
          allOf:
            - $ref: './fields.yaml#/id_string'
          example: 'us82yutrio54'

approver_file_in:
  allOf:
    - $ref: '#/file_in'
    - type: object
      required: [ user_id, org_id, type ]
      properties:
        type:
          type: string
          enum:
            - RECEIPT
          description: Approvers can create receipt files only.
        user_id:
          allOf:
            - $ref: './fields.yaml#/id_string'
          example: 'us82yutrio54'
        org_id:
          allOf:
            - $ref: './fields.yaml#/id_string'
          example: 'ort677efgh98'

approver_file_out:
  allOf:
    - $ref: '#/file_out'
    - type: object
      properties:
        type:
          type: string
          enum:
            - RECEIPT
          description: Approvers can create receipt files only.

file_delete_action_in:
  type: object
  required:
    - id
  properties:
    id:
      $ref: './fields.yaml#/id_string'

file_out_download_url:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - content_type
    - download_url
  properties:
    id:
      $ref: './fields.yaml#/id_string'
    name:
      type: string
      description: |
        Name of the uploaded file.
      example: uber_expenses_vmrpw.pdf
    content_type:
      type: string
      example: 'text/csv'
    download_url:
      type: string
      description: |
        Link to download this file.
