employee_account_summary_out:
  type: object
  required:
    - id
    - created_at
    - updated_at
    - org_id
    - org_currency
    - user_email
    - user_full_name
    - cash_account_id
    - cash_account
    - cash_account_balance
    - ccc_account_id
    - ccc_account
    - ccc_account_balance
    - advance_account_ids
    - advance_accounts
    - advance_accounts_balance
    - is_settleable
  properties:

    id:
      $ref: './fields.yaml#/id_integer'

    created_at:
      $ref: ./fields.yaml#/created_at
    updated_at:
      $ref: ./fields.yaml#/updated_at

    org_id:
      $ref: ./fields.yaml#/org_id
    org_currency:
      $ref: ./fields.yaml#/currency
    user_email:
      $ref: ./fields.yaml#/email
    user_full_name:
      type: string
      description: |
        This represents the full name of the employee
      example: foo123

    cash_account_id:
      allOf:
        - $ref: ./fields.yaml#/id_string
      example: 'accHbfr7An39w'
    cash_account:
      $ref: ./fields.yaml#/account_minimal
    cash_account_balance:
      $ref: ./fields.yaml#/amount

    ccc_account_id:
      allOf:
        - $ref: ./fields.yaml#/id_string
      example: 'accHbfr7An39w'
    ccc_account:
      $ref: ./fields.yaml#/account_minimal
    ccc_account_balance:
      $ref: ./fields.yaml#/amount

    advance_account_ids:
      type: array
      items:
        allOf:
          - $ref: './fields.yaml#/id_string'
      example: [ 'acwbl222wlg', 'accg30nel335' ]
    advance_accounts:
      type: array
      items:
        allOf:
          - $ref: './fields.yaml#/account_minimal'
    advance_accounts_balance:
      $ref: ./fields.yaml#/amount

    is_settleable:
      type: boolean
      description: |
        This indicates whether the user's accounts can be settled or not.
      example: true
