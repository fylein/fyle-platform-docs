      nullable: true
    split_expense_settings:
      type: object
      additionalProperties: true
      nullable: true
    partial_save_expense_settings:
      $ref: ./org_settings.yaml#/org_settings_partial_save_expense_settings_out
org_settings_mileage_settings_in:
  type: object
  additionalProperties: false
  required:
    - allowed
    - enabled
    - mileage_location_enabled
  properties:
    allowed:
      type: boolean
      nullable: true
    enabled:
      type: boolean
      nullable: true
    mileage_location_enabled:
      type: boolean
      nullable: true
    is_gbp_advanced_mileage_enabled:
      type: boolean
      nullable: true
      description: Accepted for compatibility but preserved from the existing settings rather than updated.
    is_passenger_mileage_enabled:
      type: boolean
      nullable: true
org_settings_tax_settings_in:
  type: object
  additionalProperties: false
  required:
    - allowed
    - enabled
    - name
    - groups
  properties:
    allowed:
      type: boolean
      nullable: true
    enabled:
      type: boolean
      nullable: true
    name:
      type: string
      nullable: true
    groups:
      type: array
      items:
        type: object
        additionalProperties: true
      nullable: true
    is_default_tax_group_allowed:
      type: boolean
      nullable: true
