org_settings_auto_report_submission_settings_in:
  type: object
  additionalProperties: false
  required:
    - expense_grouping_dimensions
  properties:
    expense_grouping_dimensions:
      type: array
      items:
        type: string
        enum:
          - PAYMENT_MODE
          - PROJECT
          - COST_CENTER
      description: When two dimensions are supplied, PAYMENT_MODE must be one of them.
      uniqueItems: true
      maxItems: 2
org_settings_bank_data_aggregation_settings_in:
  type: object
  additionalProperties: false
  required:
    - allowed
    - enabled
    - date_to_sync_from
  properties:
    allowed:
      type: boolean
      nullable: true
    enabled:
      type: boolean
      nullable: true
    date_to_sync_from:
      type: string
      format: date-time
      nullable: true
org_settings_config_mileage_in:
  type: object
  additionalProperties: false
  required:
    - unit
    - fiscal_year_start_date
    - fiscal_year_end_date
    - two_wheeler
    - four_wheeler
    - four_wheeler1
    - four_wheeler3
    - four_wheeler4
    - bicycle
    - electric_car
    - two_wheeler_slabbed_rate
    - four_wheeler_slabbed_rate
    - four_wheeler1_slabbed_rate
    - four_wheeler3_slabbed_rate
    - four_wheeler4_slabbed_rate
    - bicycle_slabbed_rate
    - electric_car_slabbed_rate
    - two_wheeler_distance_limit
    - four_wheeler_distance_limit
    - four_wheeler1_distance_limit
    - four_wheeler3_distance_limit
    - four_wheeler4_distance_limit
    - bicycle_distance_limit
    - electric_car_distance_limit
    - location_mandatory
    - enable_individual_mileage_rates
  properties:
    unit:
      type: string
      nullable: true
    fiscal_year_start_date:
      type: string
      nullable: true
    fiscal_year_end_date:
      type: string
      nullable: true
    two_wheeler:
      type: number
      nullable: true
    four_wheeler:
      type: number
      nullable: true
    four_wheeler1:
      type: number
      nullable: true
    four_wheeler3:
      type: number
      nullable: true
    four_wheeler4:
      type: number
      nullable: true
    bicycle:
      type: number
      nullable: true
    electric_car:
      type: number
      nullable: true
    two_wheeler_slabbed_rate:
      type: number
      nullable: true
    four_wheeler_slabbed_rate:
      type: number
      nullable: true
    four_wheeler1_slabbed_rate:
      type: number
      nullable: true
    four_wheeler3_slabbed_rate:
      type: number
      nullable: true
    four_wheeler4_slabbed_rate:
      type: number
      nullable: true
    bicycle_slabbed_rate:
      type: number
      nullable: true
    electric_car_slabbed_rate:
      type: number
      nullable: true
    two_wheeler_distance_limit:
      type: number
      nullable: true
    four_wheeler_distance_limit:
      type: number
      nullable: true
    four_wheeler1_distance_limit:
      type: number
      nullable: true
    four_wheeler3_distance_limit:
      type: number
      nullable: true
    four_wheeler4_distance_limit:
      type: number
      nullable: true
    bicycle_distance_limit:
      type: number
      nullable: true
    electric_car_distance_limit:
      type: number
      nullable: true
    location_mandatory:
      type: boolean
      nullable: true
    enable_individual_mileage_rates:
      type: boolean
      nullable: true
    passenger_mileage_rate:
      type: number
      nullable: true
      description: Must be greater than zero when GBP advanced mileage and passenger mileage are enabled; otherwise normalized
        to null.
    engine_capacity_bands:
      type: object
      additionalProperties: true
      description: Accepted for compatibility but preserved from the existing settings rather than updated.
org_settings_expense_settings_in:
  type: object
  additionalProperties: false
  required:
    - allowed
    - split_expense_settings
    - partial_save_expense_settings
