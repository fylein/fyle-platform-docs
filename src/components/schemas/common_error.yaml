common_request_error_out:
  type: object
  additionalProperties: false
  required:
    - data
    - error
    - message
  properties:
    data:
      type: object
      nullable: true
      additionalProperties: true
      description: Validation messages keyed by request field, or null for usage errors.
    error:
      type: string
      enum:
        - InvalidUsage
        - ValidationError
    message:
      type: string
      nullable: true
      description: Usage-error details, or null for request validation errors.

common_invalid_usage_error_out:
  type: object
  additionalProperties: false
  required:
    - data
    - error
    - message
  properties:
    data:
      type: object
      nullable: true
      description: Additional error data. These operations return null.
      example: null
    error:
      type: string
      enum:
        - InvalidUsage
    message:
      type: string
      description: Reason the operation could not be completed.
