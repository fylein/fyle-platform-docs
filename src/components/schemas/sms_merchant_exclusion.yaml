sms_merchant_exclusion_out:
  type: object
  additionalProperties: false
  required:
    - id
    - org_id
    - merchant_pattern
    - created_at
    - updated_at
  properties:
    id:
      type: string
      example: smeBKgVniE0mH
    org_id:
      type: string
      example: oriSOntNdZGd
    merchant_pattern:
      type: string
      description: Merchant name or pattern excluded from SMS notifications.
      example: uber eats
    created_at:
      $ref: './fields.yaml#/created_at'
    updated_at:
      $ref: './fields.yaml#/updated_at'

employee_sms_merchant_exclusion_out:
  type: object
  additionalProperties: false
  required:
    - id
    - org_id
    - user_id
    - merchant_pattern
    - created_at
    - updated_at
  properties:
    id:
      type: string
      example: esmeNdvxUKg48b
    org_id:
      type: string
      example: oriSOntNdZGd
    user_id:
      type: string
      example: usplIdJBA5OP
    merchant_pattern:
      type: string
      description: Merchant name or pattern excluded from SMS notifications for the employee.
      example: ikea
    created_at:
      $ref: './fields.yaml#/created_at'
    updated_at:
      $ref: './fields.yaml#/updated_at'

sms_merchant_exclusion_in:
  type: object
  required:
    - merchant_pattern
  properties:
    id:
      type: string
      nullable: true
      description: Existing exclusion ID. Omit this field or provide `null` to create an exclusion.
      example: smeBKgVniE0mH
    merchant_pattern:
      type: string
      minLength: 1
      description: Non-blank merchant name or pattern to exclude from SMS notifications.
      example: uber eats

sms_merchant_exclusion_delete_in:
  type: object
  required:
    - id
  properties:
    id:
      type: string
      example: smeBKgVniE0mH
