device_token_in:
  type: object
  additionalProperties: False
  required:
    - tokens
  properties:
    tokens:
      type: array
      items:
        type: string
      description: |
        List of Firebase Cloud Messaging (FCM) device tokens for the authenticated user's mobile devices.
      example: ['fcm_token_abc123']

device_token_out:
  type: object
  additionalProperties: False
  properties:
    id:
      allOf:
        - $ref: './fields.yaml#/id_string'
      description: |
        Unique identifier of the device token record.
      example: ndtwjwgnwwgo
    user_id:
      $ref: './fields.yaml#/user_id'
    tokens:
      type: array
      items:
        type: string
      description: |
        List of Firebase Cloud Messaging (FCM) device tokens for the authenticated user's mobile devices.
      example: ['fcm_token_abc123']
