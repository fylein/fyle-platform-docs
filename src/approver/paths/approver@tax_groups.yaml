get:
  x-internal: false
  tags:
    - Tax Groups
  summary: List tax groups
  operationId: tax_groups_list
  security:
    - oauth2:
        - '*'
  description: |
    Returns tax groups from organisations in the same group as the approver's current
    organisation where the approver has at least one non-disabled user expense approval.

    Pass `org_id=eq.<expense_org_id>` to list tax groups for one authorised organisation.
    Omit `org_id` to list tax groups across all authorised organisations.

    Filtering, sorting and pagination are supported. See the
    [Guide to Data APIs](https://docs.fylehq.com/docs/fyle-platform-docs/ZG9jOjI3Mzk2NTM3-guide-to-data-ap-is#filtering)
    for query syntax. Approval delegates with the APPROVE scope can access this API.
  parameters:
    - in: query
      name: org_id
      required: false
      description: Filter by the expense's organisation; omit to return tax groups from all authorised organisations.
      schema:
        type: string
        example: eq.orogUH5lw1QX
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - count
              - offset
            properties:
              count:
                $ref: ../../components/schemas/count.yaml
              offset:
                $ref: ../../components/schemas/offset.yaml
              data:
                type: array
                items:
                  $ref: ../../components/schemas/tax_group.yaml#/tax_group_out
          example:
            count: 1
            offset: 0
            data:
              - id: tgE7C7wKESne
                org_id: orogUH5lw1QX
                created_at: '2024-09-06T07:02:26.423917+00:00'
                updated_at: '2024-09-06T07:02:26.423917+00:00'
                code: null
                name: Tax tax tax
                percentage: 0.03
                is_enabled: true
                is_default: false
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: The current user does not have permission to access this API.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: you don't have permissions to access this resource
