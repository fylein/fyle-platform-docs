get:
  x-internal: true
  tags:
    - Departments
  summary: List departments
  operationId: departments_list
  security:
    - oauth2:
        - '*'
  description: |
    Returns departments from organisations in the same group as the approver's current
    organisation where the approver has at least one non-disabled user expense approval.

    Pass `org_id=eq.<expense_org_id>` to list departments for one authorised organisation.
    Omit `org_id` to list departments across all authorised organisations for filters
    in Team Expenses and Reports.

    Filtering, sorting and pagination are supported. See the
    [Guide to Data APIs](https://docs.fylehq.com/docs/fyle-platform-docs/ZG9jOjI3Mzk2NTM3-guide-to-data-ap-is#filtering)
    for query syntax. Approval delegates with the APPROVE scope can access this API.
  parameters:
    - in: query
      name: org_id
      required: false
      description: Filter by the expense's organisation; omit to return departments from all authorised organisations.
      schema:
        type: string
        example: eq.orogUH5lw1QX
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - count
              - offset
            properties:
              count:
                $ref: ../../components/schemas/count.yaml
              offset:
                $ref: ../../components/schemas/offset.yaml
              data:
                type: array
                items:
                  $ref: ../../components/schemas/department.yaml#/department_out
          example:
            count: 2
            offset: 0
            data:
              - id: deptodb5SbYvEX
                org_id: orogUH5lw1QX
                created_at: '2026-03-07T15:59:57.832991+00:00'
                updated_at: '2026-03-07T15:59:57.832991+00:00'
                name: Sales
                sub_department: null
                display_name: Sales
                is_enabled: true
                code: null
                description: Sales department
                department_head_user_ids: []
                department_head_users: []
                doc_url: null
              - id: deptodb666YvEX
                org_id: orx9wL3mP2Qz
                created_at: '2026-03-07T15:59:57.832991+00:00'
                updated_at: '2026-03-07T15:59:57.832991+00:00'
                name: Sales
                sub_department: null
                display_name: Sales
                is_enabled: true
                code: null
                description: Subsidiary sales department
                department_head_user_ids: []
                department_head_users: []
                doc_url: null
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: The current user does not have permission to access this API.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: you don't have permissions to access this resource
