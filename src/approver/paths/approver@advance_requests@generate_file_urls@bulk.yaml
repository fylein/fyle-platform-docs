post:
  x-internal: false
  operationId: advance_requests_generate_file_urls_bulk_post
  tags:
    - Advances
  summary: Bulk generate download and upload URLs for advance request files
  description: |
    Generate upload and download URLs for files associated with advance
    requests. In platform streaming mode, each action can request newly
    generated Fyle auth-service signed download URLs with a five-minute
    validity. Signing changes only `download_url`; `upload_url` remains
    unchanged and is null for locked files. Without the streaming header, the
    API returns S3 presigned URLs for compatibility and does not apply Fyle URL
    signing.
  parameters:
    - $ref: ../../components/parameters/file_streaming_supported.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: ../../components/schemas/advance_request.yaml#/advance_request_generate_file_urls_in
              example:
                - id: areqWQsueRHdy
                  file_ids:
                    - fiH717IpzaTG
                  requires_signed_url: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_out
                example:
                  - id: fiH717IpzaTG
                    name: foodreceipt.png
                    content_type: image/png
                    download_url: https://us1.fylehq.com/platform/v1/approver/files/download?id=fiH717IpzaTG
                    upload_url: https://us1.fylehq.com/platform/v1/approver/files/upload?id=fiH717IpzaTG
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403.yaml
