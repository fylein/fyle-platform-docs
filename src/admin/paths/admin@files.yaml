post:
  x-internal: false
  operationId: files_post
  tags:
    - Files
  summary: Create a file
  description: |
    Create file metadata. Set `X-Fyle-File-Streaming-Supported` to `true` to
    receive platform-api upload and download URLs. If the header is omitted or
    `false`, the response contains S3 presigned URLs for compatibility.
  parameters:
    - $ref: ../../components/parameters/file_streaming_supported.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: ../../components/schemas/file.yaml#/admin_file_in
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/file.yaml#/file_out
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
