post:
  x-internal: true
  tags:
    - Copilot
  summary: Record feedback on a Copilot chat message
  description: |
    Records sentiment feedback (and an optional comment) for a Copilot chat message owned by the
    authenticated admin.
  operationId: admin_copilot_messages_feedback_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/copilot.yaml#/copilot_chat_message_feedback_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                type: object
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden. Also returned when Copilot is not enabled for the organisation.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
