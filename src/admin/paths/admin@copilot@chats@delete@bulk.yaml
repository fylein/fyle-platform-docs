post:
  x-internal: true
  tags:
    - Copilot
  summary: Delete Copilot chats
  description: |
    Deletes one or more Copilot chats owned by the authenticated admin, along with their messages.
  operationId: admin_copilot_chats_delete_bulk_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '../../components/schemas/copilot.yaml#/copilot_chat_delete_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
    '400':
      description: Bad request. Also returned when a chat id does not belong to the authenticated admin.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden. Also returned when Copilot is not enabled for the organisation.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
