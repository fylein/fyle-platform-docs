post:
  x-internal: false
  tags:
    - Statements
  summary: Upload a statement
  description: |
    Upload a corporate card statement(csv or excel) to Sage Exp Mgmt for reconciliation.
  operationId: statements_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: '../../components/schemas/statements.yaml#/statements_in'
          required:
            - data
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/statements.yaml#/statements_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../../components/schemas/400.yaml'
              - $ref: '../../components/schemas/statements.yaml#/statement_upload_error_out'
          examples:
            invalid_usage:
              summary: File id is incorrect or does not belong to the user/org
              value:
                message: File id is incorrect and no such file exists
            statement_upload_exception:
              summary: File failed multiple validations while parsing
              value:
                data:
                  - column_label: B
                    column_name: null
                    column_number: 2
                    message: A column header is empty. Please add a value for each header.
                    row_number: 1
                  - column_label: null
                    column_name: null
                    column_number: null
                    message: Some columns in your file do not have names. Please add the missing column names.
                    row_number: 4
                  - column_label: null
                    column_name: null
                    column_number: null
                    message: Row is empty. Please remove it.
                    row_number: 3
                error: StatementUploadException
                message: Errors were found while processing your file. Please fix them and try again.
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
