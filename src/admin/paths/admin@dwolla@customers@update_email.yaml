post:
  tags: [Dwolla Customers]
  summary: Update the verified Dwolla business-customer email
  operationId: dwolla_customers_update_email_admin_post
  parameters: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
  responses:
    '200':
      description: Email updated and synchronized from Dwolla
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [email]
                properties:
                  email: {type: string, format: email}
    '400': {description: Invalid request or customer state}
    '401': {description: Unauthorized request}
    '403': {description: Forbidden}
    '404': {description: Organization or customer not found}
