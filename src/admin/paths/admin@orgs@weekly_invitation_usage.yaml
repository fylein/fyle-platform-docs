get:
  tags:
    - Organisations
  summary: Get weekly employee invitation usage
  description: |
    This API returns the current week's employee invitation usage for the organisation.
    It shows how many invitations have been sent this week, the configured weekly limit,
    and whether the limit has been reached.

    If the organisation is still within its onboarding period, no weekly limit is enforced
    and `weekly_limit` will be `null`.
  operationId: orgs_get_weekly_invitation_usage
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/org.yaml#/org_weekly_invitation_usage_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
