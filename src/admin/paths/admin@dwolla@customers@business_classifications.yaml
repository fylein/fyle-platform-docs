get:
  tags:
    - Dwolla Customers
  summary: Get Dwolla business classifications
  operationId: dwolla_business_classifications_admin_get
  parameters: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, count]
            properties:
              data:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name, industry_classifications]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    industry_classifications:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, name]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
              count:
                type: integer
                minimum: 0
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
