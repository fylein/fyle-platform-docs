get:
  x-internal: false
  tags:
    - Corporate Cards
  summary: List corporate card bank names
  description: |
    This API just returns all the bank names associated with the corporate cards in the org
  operationId: corporate_cards_bank_names_list
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/corporate_card.yaml#/corporate_card_bank_names_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml


