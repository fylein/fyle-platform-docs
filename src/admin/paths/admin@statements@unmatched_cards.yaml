post:
  x-internal: true
  tags:
    - Statements
  summary: Get unmatched cards from a statement
  description: |
    Returns the masked card numbers found in a statement that don't match any existing corporate
    card in the organisation, using the provided column mapping.
  operationId: statements_unmatched_cards
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/statements.yaml#/unmatched_cards_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/statements.yaml#/unmatched_cards_out'
    '400':
      description: |
        Bad request. Also returned for statement-mapping validation failures (missing mandatory
        fields, no matching transactions, or a bank name mismatch for bin-locked organisations).
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
