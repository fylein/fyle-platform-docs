post:
  x-internal: false
  tags:
    - Statements
  summary: Preview of the uploaded statement
  description: |
    This API helps in converting the statement with the mapping chosed and helps the user to preview it, this doesn't save the statement
  operationId: statements_preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: '../../components/schemas/statements.yaml#/preview_from_statement_in'
          required:
            - data
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/statements.yaml#/preview_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '../../components/schemas/400.yaml'
              - $ref: '../../components/schemas/statements.yaml#/statement_upload_error_out'
          examples:
            invalid_usage:
              summary: Statement can't be previewed
              value:
                message: Corporate card transactions already created for this statement
            no_transactions:
              summary: No transactions are left in the statement
              value:
                data:
                  - title: No Transactions Found
                    description: No transactions found after ignoring duplicates.
                    action: Please check your statement and re-upload.
                    column_number: null
                    column_label: null
                    column_name: null
                    row_numbers: null
                error: SpreadsheetException
                message: Errors were found while processing your file.
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'