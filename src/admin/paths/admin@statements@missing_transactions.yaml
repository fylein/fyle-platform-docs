post:
  x-internal: false
  tags:
    - Statements
  summary: Process RTF Missing Transactions Reconciliation
  description: |
    This API is used to start processing RTF missing transactions reconciliation of a statement.
  operationId: post_missing_transactions
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: '../../components/schemas/statements.yaml#/rtf_missing_transaction_from_statement_in'
          required:
            - data
  responses:
    '200':
      description: OK
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'


get:
  x-internal: false
  tags:
    - Statements
  summary: Get RTF Missing Transactions Reconciliation Data
  description: |
    This API is used to get the data for RTF missing transactions reconciliation of a statement.
  operationId: get_missing_transactions
  parameters:
    - $ref: ../../components/parameters/id.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/statements.yaml#/rtf_missing_transaction_from_statement_out
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../../components/schemas/400.yaml
              - $ref: ../../components/schemas/statements.yaml#/statement_upload_error_out
          examples:
            spreadsheet_exception:
              summary: Statement has invalid data
              value:
                data:
                  - title: Date not within allowed period
                    description: Date in your statement is older than 20 months.
                    action: Please correct date and re-upload.
                    column_number: null
                    column_label: null
                    column_name: null
                    row_numbers:
                      - 2
                      - 5
                error: SpreadsheetException
                message: Errors were found while processing your file.
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
