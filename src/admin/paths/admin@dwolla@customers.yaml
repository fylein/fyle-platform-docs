get:
  tags:
    - Dwolla Customers
  summary: Get the organization's Dwolla business customer
  description: Returns null data before the organization creates its business customer.
  operationId: dwolla_business_customer_admin_get
  parameters: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                nullable: true
                allOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - external_id
                      - first_name
                      - last_name
                      - email
                      - address1
                      - address2
                      - city
                      - state
                      - postal_code
                      - business_type
                      - business_name
                      - doing_business_as
                      - business_classification
                      - status
                      - ssn
                      - ein
                      - phone
                      - website
                      - controller
                      - is_customer_verified
                      - is_bank_account_added
                      - is_bank_account_verified
                      - is_customer_document_needed
                      - is_beneficial_owner_document_needed
                      - is_customer_retry
                      - is_beneficial_owner_retry
                      - is_customer_suspended
                      - customer_document_targets
                    properties:
                      external_id: {type: string, format: uuid}
                      first_name: {type: string, nullable: true}
                      last_name: {type: string, nullable: true}
                      email: {type: string, nullable: true}
                      address1: {type: string, nullable: true}
                      address2: {type: string, nullable: true}
                      city: {type: string, nullable: true}
                      state: {type: string, nullable: true}
                      postal_code: {type: string, nullable: true}
                      business_type: {type: string, nullable: true}
                      business_name: {type: string, nullable: true}
                      doing_business_as: {type: string, nullable: true}
                      business_classification: {type: string, nullable: true}
                      status:
                        type: string
                        enum: [unverified, verified, retry, document, suspended, deactivated]
                      ssn: {type: string, nullable: true}
                      ein: {type: string, nullable: true}
                      phone: {type: string, nullable: true}
                      website: {type: string, nullable: true}
                      controller:
                        type: object
                        nullable: true
                        additionalProperties: false
                        properties:
                          first_name: {type: string, nullable: true}
                          last_name: {type: string, nullable: true}
                          title: {type: string, nullable: true}
                          date_of_birth: {type: string, nullable: true}
                          ssn: {type: string, nullable: true}
                          passport_number: {type: string, nullable: true}
                          passport_country: {type: string, nullable: true}
                          address1: {type: string, nullable: true}
                          address2: {type: string, nullable: true}
                          address3: {type: string, nullable: true}
                          city: {type: string, nullable: true}
                          state_province_region: {type: string, nullable: true}
                          postal_code: {type: string, nullable: true}
                          country: {type: string, nullable: true}
                      is_customer_verified: {type: boolean, nullable: true}
                      is_bank_account_added: {type: boolean, nullable: true}
                      is_bank_account_verified: {type: boolean, nullable: true}
                      is_customer_document_needed: {type: boolean, nullable: true}
                      is_beneficial_owner_document_needed: {type: boolean, nullable: true}
                      is_customer_retry: {type: boolean, nullable: true}
                      is_beneficial_owner_retry: {type: boolean, nullable: true}
                      is_customer_suspended: {type: boolean, nullable: true}
                      customer_document_targets:
                        type: array
                        items:
                          type: string
                          enum: [individual, controller, business, dba]
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Organization not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
