post:
  x-internal: true
  tags:
    - Bank Feed Transactions
  summary: Create bank feed transactions
  description: |
    Creates one or more incoming bank feed transactions to be processed into corporate card
    transactions.
  operationId: bank_feed_transactions_bulk_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '../../components/schemas/bank_feed_transaction.yaml#/bank_feed_transaction_bulk_create_in'
  responses:
    '200':
      description: OK
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
