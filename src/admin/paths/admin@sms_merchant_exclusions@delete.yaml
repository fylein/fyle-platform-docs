post:
  x-internal: true
  tags:
    - SMS Merchant Exclusions
  security:
    - oauth2: ['*']
  summary: Delete an organisation SMS merchant exclusion
  description: Deletes the accessible organisation-level exclusion identified by `id` and returns the deleted record.
  operationId: admin_sms_merchant_exclusions_delete_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/sms_merchant_exclusion.yaml#/sms_merchant_exclusion_delete_in'
            reason:
              type: string
              description: Optional reason for deleting the exclusion.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/sms_merchant_exclusion.yaml#/sms_merchant_exclusion_out'
    '400':
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Organisation SMS merchant exclusion not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
