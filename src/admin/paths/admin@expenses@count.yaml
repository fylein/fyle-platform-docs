get:
  tags:
    - Expenses
  summary: Get expense count
  description: |
    Returns the number of expenses in the requested state that belong to enabled employees in the organization.
  operationId: expenses_count
  parameters:
    - in: query
      name: state
      required: true
      description: Expense state for which the count should be returned.
      schema:
        type: string
        enum:
          - DRAFT
          - COMPLETE
          - APPROVER_PENDING
          - APPROVED
          - PAYMENT_PENDING
          - PAYMENT_PROCESSING
          - PAID
          - UNREPORTABLE
        example: DRAFT
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/expense.yaml#/expenses_count_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
              - error
              - message
            properties:
              data:
                type: object
                nullable: true
                example: null
              error:
                type: string
                enum:
                  - InvalidUsage
              message:
                type: string
                example: You don't have permissions to access this resource
