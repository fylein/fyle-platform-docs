get:
  x-internal: false
  operationId: files_download_get
  tags:
    - Files
  summary: Download a file
  description: |
    Authorizes access to an organization file and redirects the client to the
    file download URL. This endpoint supports the ADMIN, AUDITOR, FINANCE,
    PAYMENT_PROCESSOR, and VERIFIER roles.
  parameters:
    - in: query
      name: id
      required: true
      schema:
        type: string
        example: fiNhunGsCQJb
  responses:
    '302':
      description: Redirect to file download URL
      headers:
        Location:
          schema:
            type: "string"
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
