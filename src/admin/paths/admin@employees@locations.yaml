get:
  x-internal: false
  tags:
    - Employees
  summary: List employees locations
  operationId: employees_locations_list
  description: |
    This API returns the list of locations of employees based on the query parameters.
  parameters:
    - $ref: '../../components/parameters/q.yaml'
    - $ref: '../../components/parameters/limit.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/employee.yaml#/employees_locations_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
