get:
  x-internal: true
  tags:
    - Spender Onboarding
  summary: Get spender onboarding state
  description: |
    Returns the authenticated spender's onboarding state and the configured/skipped
    status of each onboarding step.
  operationId: spender_onboarding_get
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/spender_onboarding.yaml#/spender_onboarding_out'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: No onboarding was found for this spender
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
