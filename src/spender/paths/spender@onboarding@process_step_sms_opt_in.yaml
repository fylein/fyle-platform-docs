post:
  x-internal: true
  tags:
    - Spender Onboarding
  summary: Process SMS opt-in onboarding step
  description: |
    Marks the SMS opt-in onboarding step as configured or skipped for the authenticated
    spender. Exactly one of `is_configured` or `is_skipped` must be provided. This step is
    only available for organisations with VISA, MasterCard, or AMEX card feed enrollment
    settings enabled, and can only be processed once.
  operationId: spender_onboarding_process_step_sms_opt_in_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/spender_onboarding.yaml#/spender_onboarding_step_sms_opt_in_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/spender_onboarding.yaml#/spender_onboarding_step_sms_opt_in_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: No onboarding was found for this spender
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
