post:
  x-internal: false
  operationId: files_generate_urls_bulk_post
  tags:
    - Files
  summary: Bulk generate download and upload URLs
  description: |
    Generate upload and download URLs for multiple files. In platform streaming
    mode, each item can independently request a newly generated Fyle
    auth-service signed download URL with a five-minute validity. Signing
    changes only `download_url`; `upload_url` remains unchanged and is null for
    locked files. Without the streaming header, the API returns S3 presigned
    URLs for compatibility and does not apply Fyle URL signing.
  parameters:
    - $ref: ../../components/parameters/file_streaming_supported.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_in
              example:
                - id: sdfd2391
                  requires_signed_url: false
                - id: sdfd2392
                  requires_signed_url: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_out
                example:
                  - id: sdfd2391
                    name: uber_expenses_vmrpw.pdf
                    content_type: application/pdf
                    download_url: https://us1.fylehq.com/platform/v1/spender/files/download?id=sdfd2391
                    upload_url: https://us1.fylehq.com/platform/v1/spender/files/upload?id=sdfd2391
                  - id: sdfd2392
                    name: lyft_expenses_vmrpw.pdf
                    content_type: application/pdf
                    download_url: https://us1.fylehq.com/platform/v1/spender/files/download?id=sdfd2392
                    upload_url: https://us1.fylehq.com/platform/v1/spender/files/upload?id=sdfd2392
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403.yaml
