get:
  tags:
    - Corporate Cards
  summary: Get RTF monthly enrollment usage
  description: |
    This API returns the spender's current-month RTF corporate card enrollment usage, 
    including the number of cards enrolled, the configured monthly limit, and whether the limit has been reached.
  operationId: corporate_cards_rtf_monthly_enrollment_usage
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/corporate_card.yaml#/corporate_card_rtf_monthly_enrollment_usage_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
