post:
  tags:
    - Dwolla Funding Sources
  summary: Remove the active bank funding source
  operationId: dwolla_spender_funding_source_delete_v2
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              type: object
              additionalProperties: false
              properties: {}
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                type: object
                additionalProperties: false
                required:
                  - removed
                properties:
                  removed:
                    type: boolean
                    enum:
                      - true
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - error
              - message
            properties:
              data:
                nullable: true
              error:
                type: string
              message:
                type: string
