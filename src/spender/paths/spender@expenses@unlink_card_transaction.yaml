post:
  x-internal: true
  tags:
    - Expenses
  summary: Unlink expense from card transaction
  description: |
    Unlinks the authenticated spender's expense (or, for a split expense, all expenses in its split
    group) from its matched corporate card transaction. A new, system-generated expense is created
    and linked to the card transaction in its place; the original expense is returned unlinked.
  operationId: spender_expenses_unlink_card_transaction_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/expense.yaml#/unlink_card_transaction_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/expense.yaml#/unlink_card_transaction_out'
    '400':
      description: |
        Bad request. Also returned when the expense is not linked to any card transaction, or when
        no expenses are found for its split group.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: |
        Not Found. Also returned when the expense's matched corporate card transaction cannot be
        found.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
