post:
  tags:
    - Dwolla Customers
  summary: Create a receive-only Dwolla customer
  description: |
    Create a receive-only Dwolla customer for the authenticated spender. Customer identity and ownership are derived from the authenticated principal.
  operationId: dwolla_spender_customer_create
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              type: object
              additionalProperties: false
              properties: {}
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                type: object
                additionalProperties: false
                required:
                  - external_id
                properties:
                  external_id:
                    type: string
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - error
              - message
            properties:
              data:
                nullable: true
              error:
                type: string
              message:
                type: string
