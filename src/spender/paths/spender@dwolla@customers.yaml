get:
  tags:
    - Dwolla Customers
  summary: Get the receive-only Dwolla customer
  description: |
    Retrieve the receive-only Dwolla customer for the authenticated spender. Returns null before customer setup is complete.
  operationId: dwolla_spender_customer_get_v2
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                nullable: true
                type: object
                additionalProperties: false
                required:
                  - external_id
                  - is_bank_account_added
                  - is_org_customer_verified
                properties:
                  external_id:
                    type: string
                  is_bank_account_added:
                    type: boolean
                    nullable: true
                  is_org_customer_verified:
                    type: boolean
                  is_customer_verified:
                    type: boolean
                    nullable: true
                  is_customer_document_needed:
                    type: boolean
                    nullable: true
                  is_beneficial_owner_document_needed:
                    type: boolean
                    nullable: true
                  is_customer_retry:
                    type: boolean
                    nullable: true
                  is_beneficial_owner_retry:
                    type: boolean
                    nullable: true
                  is_customer_suspended:
                    type: boolean
                    nullable: true
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - error
              - message
            properties:
              data:
                nullable: true
              error:
                type: string
              message:
                type: string

post:
  tags:
    - Dwolla Customers
  summary: Create a receive-only Dwolla customer
  description: |
    Create a receive-only Dwolla customer for the authenticated spender. Customer identity and ownership are derived from the authenticated principal.
  operationId: dwolla_spender_customer_create
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              type: object
              additionalProperties: false
              properties: {}
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                type: object
                additionalProperties: false
                required:
                  - external_id
                properties:
                  external_id:
                    type: string
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - error
              - message
            properties:
              data:
                nullable: true
              error:
                type: string
              message:
                type: string
