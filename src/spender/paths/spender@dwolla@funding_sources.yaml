get:
  tags:
    - Dwolla Customers
  summary: List active spender funding sources
  description: |
    Retrieve active non-balance funding sources for the authenticated spender.
    At most one funding source is returned.
  operationId: dwolla_spender_funding_sources_get
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - count
            properties:
              data:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - status
                    - bank_account_type
                    - name
                    - bank_name
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                    bank_account_type:
                      type: string
                      nullable: true
                    name:
                      type: string
                      nullable: true
                    bank_name:
                      type: string
                      nullable: true
              count:
                type: integer
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - error
              - message
            properties:
              data:
                nullable: true
              error:
                type: string
              message:
                type: string
