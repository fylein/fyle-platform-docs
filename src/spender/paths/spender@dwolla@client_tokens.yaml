post:
  tags:
    - Dwolla Client Tokens
  summary: Create a Drop-in client token
  operationId: dwolla_spender_client_token_create
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - action
                - _links
              properties:
                action:
                  type: string
                  enum:
                    - customer.fundingsources.create
                    - customer.fundingsources.read
                _links:
                  type: object
                  additionalProperties: false
                  required:
                    - customer
                  properties:
                    customer:
                      type: object
                      additionalProperties: false
                      required:
                        - href
                      properties:
                        href:
                          type: string
                          format: uri
  responses:
    '200':
      description: Client token created
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                type: object
                additionalProperties: false
                required:
                  - token
                properties:
                  token:
                    type: string
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/403.yaml'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
    '500':
      description: Provider failure
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/500.yaml'
