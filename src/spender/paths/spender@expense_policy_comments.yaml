post:
  x-internal: false
  tags:
    - Expense Policy Comments
  summary: Add expense policy comment
  description: |
    This API adds or updates expense policy comments. 
    
    **Note:** 
    - If the specified `comment_type` already exists for the expense, the API will update the existing comment's `comment_text` with the new value provided, rather than creating a new comment entry.
    - If the `comment_type` is specified and the `comment_text` is null or an empty string, the comment will be deleted for that expense.
  operationId: add_expense_policy_comment
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: '../../components/schemas/expense.yaml#/expense_policy_comments_upsert_in'
          required:
            - data
          additionalProperties: False
        example:
          data:
            expense_id: "txGCcvnhUbrP"
            expense_policy_comments:
              - comment_type: "MISSING_FIELDS"
                comment_text: "Reason for missing fields"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/expense.yaml#/expense_policy_comments_upsert_out'
          example:
            data:
              expense_id: "txGCcvnhUbrP"
              expense_policy_comments:
                - id: "epc1a2f3farmk"
                  expense_id: "txGCcvnhUbrP"
                  org_id: "orGCcvnhUbrP"
                  comment_type: "POLICY_VIOLATION_REASON"
                  comment_text: "This expense was required for a client meeting"
                  created_at: "2026-09-08T06:30:00.000Z"
                  updated_at: "2026-09-08T06:30:00.000Z"
                  creator_user_id: "usRahul123"
                  creator_user:
                    id: "usRahul123"
                    email: "rahul@example.com"
                    full_name: "Rahul"
    '401':
      description: Unauthorised request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '400':
      description: Unauthorised request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
