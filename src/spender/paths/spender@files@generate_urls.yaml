post:
  x-internal: false
  tags:
    - Files
  summary: Generate download and upload URLs
  description: |
    Generate upload and download URLs for a file. In platform streaming mode,
    `requires_signed_url: true` returns a newly generated Fyle auth-service
    signed download URL that is valid for five minutes. If the option is
    `false` or omitted, the direct platform-api download URL is returned.
    Signing changes only `download_url`; `upload_url` remains unchanged and is
    null when the file is locked. Without the streaming header, the API returns
    S3 presigned URLs for compatibility and does not apply Fyle URL signing.
  parameters:
    - $ref: ../../components/parameters/file_streaming_supported.yaml
  operationId: files_generate_urls_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_in
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_out
    '401':
      description: Unauthorised request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
    '400':
      description: Unauthorised request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/400.yaml'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/404.yaml'
