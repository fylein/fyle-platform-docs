post:
  x-internal: false
  operationId: employee_overview_files_generate_urls_bulk_post
  tags:
    - Employees
  summary: Bulk generate download URLs for files under the current user's hierarchy
  description: |
    Validate that all requested files belong to users in the current approver's
    hierarchy and generate download URLs for those files. Manager responses
    always contain `upload_url: null`. In platform streaming mode, each item can
    independently request a newly generated Fyle auth-service signed download
    URL with a five-minute validity. Without the streaming header, the API
    returns S3 presigned download URLs for compatibility and does not apply Fyle
    URL signing.
  parameters:
    - $ref: ../../components/parameters/file_streaming_supported.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: False
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_in
              example:
                - id: fi123819sa
                  requires_signed_url: false
                - id: fi876833tu
                  requires_signed_url: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: False
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/file.yaml#/file_generate_urls_action_out
                example:
                  - id: sdfd2391
                    name: uber_expenses_vmrpw.pdf
                    content_type: application/pdf
                    download_url: https://us1.fylehq.com/platform/v1/manager/employee_overview/files/download?id=sdfd2391
                    upload_url: null
                  - id: sdfd2392
                    name: lyft_expenses_vmrpw.pdf
                    content_type: application/pdf
                    download_url: https://us1.fylehq.com/platform/v1/manager/employee_overview/files/download?id=sdfd2392
                    upload_url: null
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400.yaml
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/401.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: |
                  This error means current user does not have enough permissions to perform this operation.
