post:
  tags:
    - Organizations
  security: []
  summary: Create an organization account
  description: Creates a new organization and its owner account using an internal signup token.
  operationId: common_orgs_signup_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/org.yaml#/org_signup_in'
  responses:
    '200':
      description: Organization created
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_request_error_out'
    '403':
      description: Invalid or missing internal signup token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_invalid_usage_error_out'
    '409':
      description: User already exists
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_invalid_usage_error_out'
