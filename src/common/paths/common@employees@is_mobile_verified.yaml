post:
  tags:
    - Employees
  security:
    - oauth2: ['*']
  summary: Check whether a mobile number is verified
  description: Checks whether the supplied mobile number is verified for an employee.
  operationId: common_employees_is_mobile_verified_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/employee.yaml#/common_employee_mobile_verification_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/employee.yaml#/common_employee_mobile_verification_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_request_error_out'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
