post:
  tags:
    - Places
  security:
    - oauth2: ['*']
  summary: Suggest locations
  description: Returns location suggestions matching the supplied search query.
  operationId: location_autocomplete_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/location.yaml#/location_autocomplete_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/location.yaml#/location_autocomplete_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/location.yaml#/location_error_out'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
