post:
  tags:
    - Places
  security:
    - oauth2: ['*']
  summary: Geocode a location
  description: Returns geographic details for the supplied place identifier.
  operationId: location_geocode_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/location.yaml#/location_geocode_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/location.yaml#/location_geocode_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/location.yaml#/location_error_out'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
