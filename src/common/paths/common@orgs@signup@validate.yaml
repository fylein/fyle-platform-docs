post:
  tags:
    - Organizations
  security: []
  summary: Validate an organization signup
  description: Checks whether the supplied email can be used to create an organization account.
  operationId: common_orgs_signup_validate_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/org.yaml#/org_signup_validate_in'
  responses:
    '200':
      description: Signup is allowed
    '400':
      description: Bad request or verified organization domain
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_request_error_out'
    '409':
      description: User already exists
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_invalid_usage_error_out'
