post:
  tags:
    - Places
  security:
    - oauth2: ['*']
  summary: Get directions
  description: Returns an encoded route polyline between the supplied coordinates.
  operationId: location_directions_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/location.yaml#/location_route_in'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - data
            properties:
              data:
                $ref: '../../components/schemas/location.yaml#/location_directions_out'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/location.yaml#/location_error_out'
    '401':
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/401.yaml'
