post:
  tags:
    - Secondary Emails
  security: []
  summary: Verify a secondary email
  description: Marks the secondary email identified by the supplied ID as verified.
  operationId: common_secondary_emails_verify_post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - data
          properties:
            data:
              $ref: '../../components/schemas/secondary_email.yaml#/secondary_email_verify_in'
  responses:
    '200':
      description: Secondary email verified
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_request_error_out'
    '404':
      description: Secondary email not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_invalid_usage_error_out'
    '409':
      description: Email is already in use
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common_error.yaml#/common_invalid_usage_error_out'
